[project]
name = "siam-bean-erp-backend"
version = "0.1.0"
description = "FastAPI backend for the Siam Bean Co. Mini ERP"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.148.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
